name: Déploiement GitHub Pages

on:
  push:
    branches:
      - main
      - 'claude/**'
  workflow_dispatch:

concurrency:
  group: pages
  cancel-in-progress: false

# On publie le build sur la branche gh-pages avec le GITHUB_TOKEN, qui a le
# droit d'écrire dans le dépôt. L'API « Pages » officielle, elle, exige les
# droits admin que ce jeton n'a pas (« Resource not accessible by integration »).
permissions:
  contents: write

jobs:
  # L'APK Android (Trusted Web Activity, voir android/LISEZMOI.md). S'il échoue,
  # le site se déploie quand même, sans APK : le hors-ligne du site ne dépend
  # pas de lui.
  apk:
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: android-actions/setup-android@v3
        with:
          packages: 'platforms;android-35 build-tools;35.0.0'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.11.1

      - name: Clé de signature (secret du dépôt, sinon clé temporaire)
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_B64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          set -e
          cd android
          if [ -n "$KEYSTORE_B64" ]; then
            echo "$KEYSTORE_B64" | base64 -d > bruit.keystore
            echo "BRUIT_KEYSTORE_PASSWORD=$KEYSTORE_PASSWORD" >> "$GITHUB_ENV"
            echo "BRUIT_KEY_ALIAS=${KEY_ALIAS:-bruit}" >> "$GITHUB_ENV"
            echo "BRUIT_KEY_PASSWORD=${KEY_PASSWORD:-$KEYSTORE_PASSWORD}" >> "$GITHUB_ENV"
            echo "stable" > signature.txt
          else
            keytool -genkeypair -v -keystore bruit.keystore -alias bruit \
              -keyalg RSA -keysize 2048 -validity 10000 \
              -storepass bruit-temporaire -keypass bruit-temporaire \
              -dname "CN=Bruit (clé temporaire), O=Formation, C=CA"
            echo "BRUIT_KEYSTORE_PASSWORD=bruit-temporaire" >> "$GITHUB_ENV"
            echo "BRUIT_KEY_ALIAS=bruit" >> "$GITHUB_ENV"
            echo "BRUIT_KEY_PASSWORD=bruit-temporaire" >> "$GITHUB_ENV"
            echo "temporaire" > signature.txt
          fi
          echo "BRUIT_KEYSTORE=$PWD/bruit.keystore" >> "$GITHUB_ENV"

      - name: Construire l'APK
        run: cd android && gradle assembleRelease --no-daemon --console=plain

      - name: Empaqueter (APK, métadonnées, assetlinks)
        run: |
          set -e
          mkdir -p sortie/telecharger sortie/.well-known
          cp android/app/build/outputs/apk/release/app-release.apk sortie/telecharger/bruit.apk
          VERSION=$(node -p "require('./package.json').version")
          SHA=$(sha256sum sortie/telecharger/bruit.apk | cut -d' ' -f1)
          TAILLE=$(stat -c%s sortie/telecharger/bruit.apk)
          DATE=$(TZ=America/Toronto date '+%Y-%m-%d %H h %M')
          SIGNATURE=$(cat android/signature.txt)
          EMPREINTE=$(keytool -list -v -keystore android/bruit.keystore -alias "$BRUIT_KEY_ALIAS" \
            -storepass "$BRUIT_KEYSTORE_PASSWORD" | grep -m1 'SHA256:' | sed 's/.*SHA256: *//')
          cat > sortie/telecharger/bruit.json <<JSON
          {"version":"$VERSION","date":"$DATE","sha256":"$SHA","taille":$TAILLE,"signature":"$SIGNATURE","empreinte":"$EMPREINTE"}
          JSON
          cat > sortie/.well-known/assetlinks.json <<JSON
          [{"relation":["delegate_permission/common.handle_all_urls"],"target":{"namespace":"android_app","package_name":"io.github.frankyray21.bruit","sha256_cert_fingerprints":["$EMPREINTE"]}}]
          JSON
          cat sortie/telecharger/bruit.json

      - uses: actions/upload-artifact@v4
        with:
          name: apk
          path: sortie
          if-no-files-found: error
          # .well-known/ commence par un point : sans ceci, il serait ignoré.
          include-hidden-files: true

  deployer:
    runs-on: ubuntu-latest
    needs: [apk]
    if: always()
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      # Le moteur de calcul doit être vert avant toute mise en ligne : ses
      # tests reproduisent les tableaux de la formation.
      - run: npm test

      - run: npm run build
        env:
          BASE_PATH: /${{ github.event.repository.name }}/

      # L'APK et ses métadonnées rejoignent le site s'ils ont été construits.
      - uses: actions/download-artifact@v4
        continue-on-error: true
        with:
          name: apk
          path: dist

      - name: Publier sur la branche gh-pages
        run: |
          # .nojekyll : sans lui, Pages ignore les fichiers commençant par _
          touch dist/.nojekyll
          ls -la dist/telecharger dist/.well-known 2>/dev/null || echo "Pas d'APK dans cette livraison."
          cd dist
          git init -b gh-pages
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Déploiement de ${{ github.sha }}"
          git push --force \
            "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git" \
            gh-pages
