name: Déploiement GitHub Pages

on:
  push:
    branches:
      - main
      - 'claude/**'
  workflow_dispatch:

# Un seul déploiement à la fois ; on ne coupe pas celui en cours.
concurrency:
  group: pages
  cancel-in-progress: false

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      # Le moteur de calcul doit être vert avant toute mise en ligne : ses
      # tests reproduisent les tableaux de la formation.
      - run: npm test

      - run: npm run build
        env:
          BASE_PATH: /${{ github.event.repository.name }}/

      # enablement crée le site Pages si le dépôt n'en a pas encore, ce qui
      # évite d'avoir à l'activer à la main dans les réglages.
      - uses: actions/configure-pages@v5
        with:
          enablement: true

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploiement.outputs.page_url }}
    steps:
      - id: deploiement
        uses: actions/deploy-pages@v4
